# Keep tiling predictable: apps can't maximize themselves over the layout
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# XWayland drag-and-drop helper windows must not take focus
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Password prompts float in the middle
windowrule {
    name = polkit-dialog
    match:class = ^(hyprpolkitagent)$
    float = yes
    center = yes
}

# Browser picture-in-picture stays on top in a corner
windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
    move = monitor_w-window_w-24 monitor_h-window_h-24
}

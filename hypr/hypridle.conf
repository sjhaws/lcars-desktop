# LCARS idle handling. Times are in seconds; change them here.
#   5 min: dim the screen   10 min: lock   11 min: screen off
#   30 min: suspend, but only on battery (scripts/idle-suspend)
# The screen also locks before every suspend, however it was triggered.

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/generated/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-suspend
}

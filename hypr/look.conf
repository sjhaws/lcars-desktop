# LCARS window frames: thick rounded borders, no shadows or blur, snappy motion.
# The black background is the LCARS "screen"; the frame itself is the Quickshell shell.

general {
    layout = dwindle          # full tiling on every workspace
    border_size = $lcars_border
    gaps_in = $lcars_gaps_in
    gaps_out = $lcars_gaps_out
    col.active_border = $lcars_border_active
    col.inactive_border = $lcars_border_inactive
    resize_on_border = true
}

decoration {
    rounding = $lcars_rounding
    rounding_power = 2
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

# Tabbed groups (Super+G) get LCARS-style colored tabs
group {
    col.border_active = $lcars_group_active
    col.border_inactive = $lcars_border_inactive
    col.border_locked_active = $lcars_red
    col.border_locked_inactive = $lcars_border_inactive
    groupbar {
        font_family = $lcars_font
        font_size = 14
        height = 18
        gradients = true
        text_color = $lcars_text_on_color
        col.active = $lcars_group_active
        col.inactive = $lcars_group_inactive
        col.locked_active = $lcars_red
        col.locked_inactive = $lcars_group_inactive
        indicator_height = 0
    }
}

animations {
    enabled = true
    bezier = lcars, 0.2, 0.9, 0.3, 1
    animation = global,     1, 4, lcars
    animation = windowsIn,  1, 3, lcars, popin 90%
    animation = windowsOut, 1, 2, lcars, popin 90%
    animation = border,     1, 4, lcars
    animation = fade,       1, 2, lcars
    animation = workspaces, 1, 3, lcars, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    background_color = $lcars_background
    font_family = $lcars_font
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_watchdog_warning = true   # lcars-session is the watchdog (see bin/lcars-session)
    focus_on_activate = true
    # hyprland-guiutils (hyprland-dialog etc.) isn't packaged for Ubuntu 26.04:
    # don't warn about it, and don't try its "app not responding" dialog
    disable_hyprland_guiutils_check = true
    enable_anr_dialog = false
}

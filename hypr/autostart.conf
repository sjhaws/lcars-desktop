# D-Bus/systemd-activated apps (Files, portals) get the session's variables too;
# lcars-session takes the app-look ones back when the session ends
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE ADW_DEBUG_COLOR_SCHEME ADW_DEBUG_ACCENT_COLOR QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE
# hyprpolkitagent runs as a child of this session; its packaged user service is
# masked by install.sh so it stays out of GNOME
exec-once = /usr/libexec/hyprpolkitagent
# Idle: dim, lock, screen off, suspend on battery (see hypridle.conf); its packaged
# user service is masked too, or it would lock GNOME sessions with hyprlock
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
# The LCARS shell: frame, launcher and notifications (restarted if it crashes)
exec-once = ~/.config/hypr/scripts/shell $lcars_repo/shell

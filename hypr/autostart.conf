exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# hyprpolkitagent and mako run as children of this session; their packaged
# user services are masked by install.sh so they stay out of GNOME
exec-once = /usr/libexec/hyprpolkitagent
exec-once = mako      # stopgap notifications until the Quickshell notifications
exec-once = ~/.local/bin/quickshell -p $lcars_repo/shell   # LCARS frame (sidebar + top bar)

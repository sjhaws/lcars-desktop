exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# hyprpaper, hyprpolkitagent and mako run as children of this session; their
# packaged user services are masked by install.sh so they stay out of GNOME
exec-once = /usr/libexec/hyprpolkitagent
exec-once = hyprpaper -c ~/.config/hypr/generated/hyprpaper.conf
exec-once = mako      # stopgap notifications until the Quickshell shell (Phase 3)

# LCARS — Phase 1 bare Hyprland session.
# Styling (borders, palette) arrives in Phase 2; this file only proves the
# session, keybindings and escape routes.

monitor = , preferred, auto, 1

$terminal = ptyxis --new-window || gnome-terminal || foot

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

general {
    layout = dwindle          # full tiling on every workspace
    gaps_in = 4
    gaps_out = 8
}

input {
    kb_layout = us
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_watchdog_warning = true   # lcars-session is the watchdog (see bin/lcars-session)
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

$mod = SUPER

# Escape route 1: exit to the login screen. The marker tells lcars-session this
# was requested, since Hyprland 0.53 can segfault while shutting down.
bind = $mod SHIFT, Escape, exec, touch "$XDG_RUNTIME_DIR/lcars-exit-requested" && hyprctl dispatch exit

bind = $mod, Return, exec, sh -c '$terminal'
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

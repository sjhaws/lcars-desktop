# LCARS — Hyprland session (Phase 2: base session).
# Colors, font and sizes come from generated/colors.conf, built from
# tokens/palette.json by tools/lcars-gen. Nothing here hard-codes a color.

source = ~/.config/hypr/generated/colors.conf
source = ~/.config/hypr/generated/env.conf
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

monitor = , preferred, auto, 1

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

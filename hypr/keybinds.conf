# Keyboard-first. Every action here is also reachable by mouse in Phase 3's bar.

$mod      = SUPER
$terminal = ptyxis --new-window
$lcars_ipc = ~/.local/bin/quickshell -p $lcars_repo/shell ipc call
$files    = nautilus --new-window
$browser  = sh -c 'gtk-launch "$(xdg-settings get default-web-browser)"'
$scripts  = ~/.config/hypr/scripts

# --- escape route 1: exit to the login screen (see scripts/exit)
bind = $mod SHIFT, Escape, exec, $scripts/exit

# --- lock the screen (hypridle runs hyprlock)
bind = $mod, L, exec, loginctl lock-session

# --- apps
bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $lcars_ipc launcher toggle
bind = $mod, E,      exec, $files
bind = $mod, B,      exec, $browser

# --- the sidebar's custom buttons (set in ~/.config/lcars/menu.json)
bind = $mod, F1, exec, $lcars_ipc menu activate custom1
bind = $mod, F2, exec, $lcars_ipc menu activate custom2
bind = $mod, F3, exec, $lcars_ipc menu edit          # open the menu file
bind = $mod, F11, exec, $lcars_ipc frame toggleCompact  # fold the frame to a thin line and back

# --- windows
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1           # maximize, keep gaps and bar
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, G, togglegroup,                  # tabbed group
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
# next / previous workspace: the same keys as GNOME, plus Super+[ ] (free in GNOME,
# so they also work when testing in a VM window); add Shift to take the window along
bind = $mod, Page_Down,         workspace, r+1
bind = $mod, Page_Up,           workspace, r-1
bind = $mod ALT, right,         workspace, r+1
bind = $mod ALT, left,          workspace, r-1
bind = $mod, bracketright,      workspace, r+1
bind = $mod, bracketleft,       workspace, r-1
bind = $mod SHIFT, Page_Down,    movetoworkspace, r+1
bind = $mod SHIFT, Page_Up,      movetoworkspace, r-1
bind = $mod SHIFT ALT, right,    movetoworkspace, r+1
bind = $mod SHIFT ALT, left,     movetoworkspace, r-1
bind = $mod SHIFT, bracketright, movetoworkspace, r+1
bind = $mod SHIFT, bracketleft,  movetoworkspace, r-1
bind = $mod, grave, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspace, special:scratch

# --- screenshots: region or whole screen, saved to ~/Pictures/Screenshots and copied
bind = , Print, exec, $scripts/screenshot region
bind = SHIFT, Print, exec, $scripts/screenshot screen

# --- hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
